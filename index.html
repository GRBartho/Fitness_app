<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="description" content="Track your workouts and level up. Muscle ranks from F to S++.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <title>Level Up Fitness</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⚔️ LEVEL UP</div>
    <button class="gear" data-tab-go="settings" aria-label="Settings">⚙️</button>
  </header>
  <main id="main"></main>
  <div id="rest" class="rest" hidden></div>
  <nav class="tabbar">
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="train"><span>🏋️</span>Train</button>
    <button data-tab="ranks"><span>🏆</span>Ranks</button>
    <button data-tab="body"><span>⚖️</span>Body</button>
    <button data-tab="history"><span>📜</span>History</button>
  </nav>
  <div id="modal" class="modal" hidden></div>
  <div id="timer" class="timer" hidden></div>
  <div id="toasts" class="toasts"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
